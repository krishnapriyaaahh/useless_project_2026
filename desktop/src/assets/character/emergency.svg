<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
  <!-- Skull-like body -->
  <ellipse cx="50" cy="90" rx="30" ry="20" fill="#dc2626"/>
  <!-- Head — skull-ish -->
  <circle cx="50" cy="48" r="35" fill="#fef3c7"/>
  <!-- X eyes (skull) -->
  <line x1="28" y1="36" x2="40" y2="48" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="36" x2="28" y2="48" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="60" y1="36" x2="72" y2="48" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
  <line x1="72" y1="36" x2="60" y2="48" stroke="#7c2d12" stroke-width="4" stroke-linecap="round"/>
  <!-- Gaping mouth -->
  <ellipse cx="50" cy="66" rx="16" ry="11" fill="#7c2d12"/>
  <!-- Teeth -->
  <rect x="36" y="62" width="6" height="6" rx="1" fill="#fef9c3"/>
  <rect x="44" y="62" width="6" height="6" rx="1" fill="#fef9c3"/>
  <rect x="52" y="62" width="6" height="6" rx="1" fill="#fef9c3"/>
  <rect x="60" y="62" width="6" height="6" rx="1" fill="#fef9c3"/>
  <!-- Emergency sirens top -->
  <circle cx="50" cy="15" r="8" fill="#ef4444" opacity="0.9"/>
  <circle cx="50" cy="15" r="5" fill="#fbbf24"/>
  <!-- Sweat explosion -->
  <ellipse cx="83" cy="25" rx="3.5" ry="5" fill="#93c5fd"/>
  <ellipse cx="89" cy="38" rx="3" ry="4" fill="#93c5fd"/>
  <ellipse cx="17" cy="25" rx="3.5" ry="5" fill="#93c5fd"/>
  <ellipse cx="11" cy="38" rx="3" ry="4" fill="#93c5fd"/>
  <ellipse cx="50" cy="5" rx="2.5" ry="3.5" fill="#93c5fd"/>
  <!-- Radial lines = chaos -->
  <line x1="50" y1="48" x2="85" y2="10" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="48" x2="15" y2="10" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="48" x2="95" y2="48" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <line x1="50" y1="48" x2="5" y2="48" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  <!-- 🚨 -->
  <text x="2" y="115" font-size="12">🚨</text>
  <text x="80" y="115" font-size="12">🚨</text>
</svg>
